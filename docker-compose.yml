services:
  jupyter:
    image: jupyter/minimal-notebook:latest
    ports:
      - 8888:8888
    env_file:
      - .env
    volumes:
      - ./apps/backend/uploads/ipynb:/home/jovyan/work
    command: >
      bash -c "
        jupyter notebook --ServerApp.base_url=/jupyter \
                         --ServerApp.default_url=/tree \
                         --ServerApp.disable_extension=jupyterlab \
                         --ServerApp.tornado_settings='{\"headers\": {\"Content-Security-Policy\": \"frame-ancestors *\"}}'
      "
